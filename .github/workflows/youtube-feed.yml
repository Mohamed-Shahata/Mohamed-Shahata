name: Latest YouTube Video

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCUoQyWlxfL2y_8A_LQIH8tw"
          comment_tag_name: "YOUTUBE-FEED"
          max_post_count: 3
