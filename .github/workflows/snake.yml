name: Generate Snake

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Mohamed-Shahata
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0f6e56,#1d9e75,#5dcaa5&color_dots=#161b22,#0f4a3a,#1d9e75,#5dcaa5,#9fe1cb&color_empty=#161b22

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
