name: 3D Contribution Calendar

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Mohamed-Shahata

      - name: Install resvg
        run: |
          curl -L -o resvg.zip https://github.com/RazrFalcon/resvg/releases/latest/download/resvg-linux-x86_64.zip
          unzip resvg.zip -d resvg-bin
          sudo mv resvg-bin/resvg /usr/local/bin/resvg
          sudo chmod +x /usr/local/bin/resvg

      - name: Convert SVG to static PNG
        run: |
          resvg --width 1400 profile-3d-contrib/profile-night-rainbow.svg profile-3d-contrib/profile-night-rainbow.png

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f profile-3d-contrib
          git commit -m "Update 3D contribution calendar" || exit 0
          git push
